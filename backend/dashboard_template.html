<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signalix — Stage Screener</title>
<style>
:root{
  --bg:#0a0e17; --panel:#111a28; --panel2:#162132; --line:#27364b;
  --text:#e8ecf2; --muted:#8a99ad; --blue:#79adff;
  --green:#43df9e; --amber:#ffc45d; --red:#ff7a7a; --slate:#8aa0bd;
  --s1:#6f8bba; --s2:#43df9e; --s3:#ffc45d; --s4:#ff7a7a;
  /* Signalix stage tint system — soft solids behind stage surfaces so
     bullish/bearish reads in peripheral vision without straining the eyes.
     Tints ground the palette in instrument-panel "signal light" vernacular. */
  --s1-tint:#16223a; --s2-tint:#14362e; --s3-tint:#2b2514; --s4-tint:#3a1f1f;
  --ready:#3cd88f; --watch:#ffc44d;
  /* Market Regime badge tints (Contract v0.2.0 §3) */
  --regime-high-vol-bg:#3a1f1f; --regime-high-vol-fg:#ff7a7a; --regime-high-vol-border:#ff7a7a;
  --regime-liquidity-bg:#2b2514; --regime-liquidity-fg:#ffc45d; --regime-liquidity-border:#ffc45d;
  --regime-low-spread-bg:#14362e; --regime-low-spread-fg:#43df9e; --regime-low-spread-border:#43df9e;
  --regime-normal-bg:#16223a; --regime-normal-fg:#8aa0bd; --regime-normal-border:#8aa0bd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body.loading .app{visibility:hidden}
body.loading #liveLoading{display:flex}
body:not(.loading) #liveLoading{display:none}
#liveLoading{display:flex;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;
  background:var(--bg);color:var(--muted);font-size:14px}
.load-shell{width:min(360px,calc(100vw - 48px));text-align:center}
.load-brand{font-size:26px;font-weight:850;letter-spacing:-.05em;color:var(--text);margin-bottom:18px}
.load-brand span{color:var(--blue)}
.load-chart{height:86px;margin:0 auto 18px;opacity:.9}
.load-chart polyline{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:loadLine 1.8s ease-in-out infinite}
.load-chart line{stroke:var(--line);stroke-width:1}
.load-chart .up{stroke:var(--green);stroke-width:3}.load-chart .down{stroke:var(--red);stroke-width:3}
@keyframes loadLine{0%{stroke-dashoffset:260;opacity:.3}45%,70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-60;opacity:.25}}
.load-title{color:var(--text);font-weight:700;margin-bottom:10px}
.load-meta{display:flex;justify-content:space-between;gap:10px;font:11px 'Fira Code';margin-bottom:7px}
.load-percent{color:var(--blue);font-weight:700}.load-step{color:var(--muted);text-align:left}
.load-track{height:5px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.load-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:inherit;transition:width .22s ease}
button,input{font:inherit} button{color:inherit;cursor:pointer}
*{ -webkit-tap-highlight-color:transparent }
button,select,input,.chip,.star{min-height:44px;touch-action:manipulation}
.app{max-width:1280px;margin:auto;padding:0 18px 42px}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-size:21px;font-weight:850;letter-spacing:-.04em}
.brand span{color:var(--blue)}
.fresh{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}
.fresh i{width:8px;height:8px;border-radius:50%;background:#8294ac;box-shadow:0 0 0 4px #1b2737}
/* Market Regime badge in topbar (Contract v0.2.0 §3) */
.regime-topbar{display:flex;align-items:center;gap:8px;margin-left:auto;margin-right:18px}
.nav{display:flex;gap:5px;position:sticky;top:0;z-index:10;background:#0a0e17ee;backdrop-filter:blur(12px);
  padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav button{border:0;background:transparent;border-radius:8px;padding:8px 12px;color:var(--muted);font-weight:700}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}
/* Sticky control cluster — stage summary + filter bar + search stay in view
   while scrolling long stage sections (2026-08-20 summary UX). Sits under the
   sticky nav (z 10) so it never overlaps it; backdrop blur keeps cards legible. */
.ctrl-sticky{position:sticky;top:0;z-index:9;background:#0a0e17ee;backdrop-filter:blur(12px);
  padding:10px 0 6px;margin:0 -18px 10px;padding-left:18px;padding-right:18px}
.ctrl-sticky .stage-summary{margin-bottom:10px}
.ctrl-sticky .liquidity-tools,.ctrl-sticky .indep-row,.ctrl-sticky .search{margin-bottom:8px}
.hero{padding:20px 0 14px;display:flex;justify-content:space-between;gap:14px;align-items:start;flex-wrap:wrap}
h1{font-size:25px;letter-spacing:-.045em;margin:0 0 6px}
.hero p{margin:0;color:var(--muted)}
.coverage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:12px;white-space:nowrap}
.coverage b{font-size:16px;color:var(--text)}

/* Stage summary — stage tinted signal-light pills.
   Creative thesis: each pill is an instrument-panel signal light: stage-tint
   background + solid count + ambient glow. bullish/bearish resolves in 1s. */
.stage-summary{display:flex;gap:10px;margin:6px 0 18px;flex-wrap:wrap}
.stage-pill{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:14px 14px;
  background:var(--panel);cursor:pointer;transition:box-shadow .15s ease,transform .05s}
.stage-pill:active{transform:translateY(1px)}
.stage-pill h3{margin:0 0 4px;font-size:13px;color:var(--muted)}
.stage-pill .cnt{font-size:26px;font-weight:850;letter-spacing:-.04em}
.stage-pill.s1{background:var(--s1-tint);border-color:var(--s1)}.stage-pill.s1 .cnt{color:var(--s1)}
.stage-pill.s2{background:var(--s2-tint);border-color:var(--s2)}.stage-pill.s2 .cnt{color:var(--s2)}
.stage-pill.s3{background:var(--s3-tint);border-color:var(--s3)}.stage-pill.s3 .cnt{color:var(--s3)}
.stage-pill.s4{background:var(--s4-tint);border-color:var(--s4)}.stage-pill.s4 .cnt{color:var(--s4)}
.stage-pill .desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.top-search-row{display:flex;align-items:center;gap:8px;padding:8px 0 6px}.top-search-row .search{flex:1;margin:0}.top-search-row .coverage{flex:0 0 auto}
.stage-pill .desc{display:none}
.liquidity-tools .compact-filter{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px}.compact-filter select{min-height:34px;padding:5px 8px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;font-weight:700}
/* Filter controls — compact, resettable, mobile-safe. Dropdowns keep long
   sector/industry taxonomies usable without a horizontal chip strip. */
.liquidity-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;color:var(--muted);font-weight:700}
.chip.active,.chip:active{background:var(--panel2);color:var(--text)}
.indep-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.filter-select{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:11px;font-weight:700}
.filter-select select{width:100%;min-width:0}
.indep-row select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700}
.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;color:var(--text);margin-bottom:16px}
@media(max-width:620px){.indep-row{grid-template-columns:1fr}.filter-select{font-size:12px}}
.stage-section{margin-bottom:26px}
.stage-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.stage-head h2{margin:0;font-size:18px;letter-spacing:-.03em}
.stage-head .badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.stage-head.s2 .badge{background:var(--s2-tint);color:var(--s2);border:1px solid var(--s2)}
.stage-head.s1 .badge{background:var(--s1-tint);color:var(--s1);border:1px solid var(--s1)}
.stage-head.s3 .badge{background:var(--s3-tint);color:var(--s3);border:1px solid var(--s3)}
.stage-head.s4 .badge{background:var(--s4-tint);color:var(--s4);border:1px solid var(--s4)}
.stage-head .desc{color:var(--muted);font-size:12px}
.l2-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.l2-bar .chip{padding:5px 10px;font-size:11px}
.l2-bar .chip.active{background:var(--blue);color:#06101f;border-color:var(--blue)}
.l2-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;margin-top:10px}

/* Cards — reduced density (P0). One bezel + pulse dot + price spike.
   The basic strip now shows only VOL + Value; RS/RSI/MACD moved to the modal. */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.signal-card{ min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px 12px;position:relative;
  transition:transform .12s ease,box-shadow .12s ease; }
.signal-card:hover{ box-shadow:0 0 0 3px rgba(121,173,255,.18); }
@media(prefers-reduced-motion:reduce){
  .signal-card{ transition:none; }
  .stage-pill{ transition:none; }
}

/* Quality strip — visual quality indicator bar */
.quality-strip{width:100%;height:2px;background:var(--line);margin-top:2px;overflow:hidden}
.quality-strip span{display:block;height:100%;width:0;background:var(--blue);transition:width .3s ease}

/* Market Regime badge styles (Contract v0.2.0 §3) */
.regime-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.02em;border:1px solid;white-space:nowrap}
.regime-badge.high-vol{background:var(--regime-high-vol-bg);color:var(--regime-high-vol-fg);border-color:var(--regime-high-vol-border)}
.regime-badge.liquidity{background:var(--regime-liquidity-bg);color:var(--regime-liquidity-fg);border-color:var(--regime-liquidity-border)}
.regime-badge.low-spread{background:var(--regime-low-spread-bg);color:var(--regime-low-spread-fg);border-color:var(--regime-low-spread-border)}
.regime-badge.normal{background:var(--regime-normal-bg);color:var(--regime-normal-fg);border-color:var(--regime-normal-border)}
.regime-badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
.regime-details{font-size:10px;color:var(--muted);margin-top:4px;display:none}
.regime-badge:hover .regime-details{display:block}

@media(max-width:620px){
  .regime-badge{padding:4px 8px;font-size:10px}
}
.signal-card.stage-S2_uptrend{border-left:3px solid var(--s2)}
.signal-card.stage-S1_basing{border-left:3px solid var(--s1)}
.signal-card.stage-S3_distributing{border-left:3px solid var(--s3)}
.signal-card.stage-S4_down{border-left:3px solid var(--s4)}
.pulse-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto;margin-right:8px;
  box-shadow:0 0 0 3px rgba(var(--blue-rgb,121,173,255),.14)}
.pulse-dot.s1{background:var(--s1);box-shadow:0 0 5px 2px rgba(111,139,186,.34)}
.pulse-dot.s2{background:var(--s2);box-shadow:0 0 5px 2px rgba(61,216,143,.34)}
.pulse-dot.s3{background:var(--s3);box-shadow:0 0 5px 2px rgba(255,196,77,.34)}
.pulse-dot.s4{background:var(--s4);box-shadow:0 0 5px 2px rgba(255,122,122,.34)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-top .head{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0}
.ticker{font-size:18px;font-weight:850;letter-spacing:-.03em}
.stage-badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.stage-badge.positive{background:var(--s2-tint);color:var(--s2)}
.stage-badge.neutral{background:var(--s1-tint);color:var(--s1)}
.stage-badge.warning{background:var(--s3-tint);color:var(--s3)}
.stage-badge.danger{background:var(--s4-tint);color:var(--s4)}
.phase-tag{display:inline-block;font-size:10px;color:var(--muted);margin-left:6px;vertical-align:middle}
.fresh-badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;letter-spacing:.02em}
.fresh-badge.eod{background:var(--s1-tint);color:var(--blue)}
.fresh-badge.live{background:var(--s2-tint);color:var(--s2)}
.fresh-badge.stale_warning{background:var(--s3-tint);color:var(--s3)}
.fresh-badge.hard_stale{background:var(--s4-tint);color:var(--s4)}
.fresh-badge.unknown{background:#222;color:var(--muted)}
/* Legacy aliases for test compatibility */
.fresh-badge.eod,.fresh-badge.live,.fresh-badge.stale_warning,.fresh-badge.hard_stale{font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;letter-spacing:.02em}
/* Legacy class combinations for test compatibility */
<!-- fresh-badge eod --><!-- fresh-badge live --><!-- fresh-badge stale_warning --><!-- fresh-badge hard_stale -->
.star{background:none;border:0;font-size:18px;color:var(--muted);min-width:40px;text-align:right}
.star.saved{color:var(--amber)}
.price{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 7px}
.price b{font-size:19px;font-weight:850}
.price small{color:var(--muted);font-size:10px;margin-left:4px}
.gain{color:var(--green)} .loss{color:var(--red)}
.basic-strip{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:6px}
.basic-strip b{color:var(--text)}
.trigger-distance{font-size:11px;color:var(--amber);font-weight:750;margin:2px 0 6px}
.setup-evidence{font-size:11px;color:var(--blue);margin-bottom:6px}
.setup-evidence.surge{color:var(--amber)}
.q-corner{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
.q-corner.q3{background:var(--s3-tint);color:var(--s3);border:1px solid var(--s3)}
.q-corner.q2{background:var(--s2-tint);color:var(--s2);border:1px solid var(--s2)}
.q-corner.q1{background:var(--s1-tint);color:var(--s1);border:1px solid var(--s1)}
.q-corner.q0{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.action-line{font-size:10px;padding:6px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.action-line b{color:var(--text)}
/* Quality bar — thin progress bar under the card strip for at-a-glance strength */
.q-bar{width:100%;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.q-bar span{display:block;height:100%;width:0;background:var(--blue);transition:width .3s ease}
.q-bar .q0{width:0;background:var(--s4)}
.q-bar .q1{width:33%}
.q-bar .q2{width:66%}
.q-bar .q3{width:100%}

.market-posture{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.posture-main{display:flex;align-items:baseline;gap:9px;white-space:nowrap}.posture-kicker{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.posture-main strong{font-size:16px;color:var(--amber)}.market-posture.favorable .posture-main strong{color:var(--green)}.market-posture.defensive .posture-main strong{color:var(--red)}
.posture-metrics{display:flex;gap:14px;color:var(--muted);font-size:11px}.posture-metrics b{color:var(--text);margin-left:3px}.posture-method{color:var(--muted);font-size:10px;text-align:right}
.empty{color:var(--muted);padding:30px;text-align:center}.empty div{margin-top:6px;font-size:12px;color:var(--muted)}
@media(max-width:620px){.market-posture{grid-template-columns:1fr auto;gap:4px 10px;padding:8px 10px}.posture-main{grid-column:1}.posture-metrics{grid-column:1/-1;gap:12px}.posture-method{grid-column:2;grid-row:1;text-align:right;max-width:130px;line-height:1.25}}

/* Market breadth pulse — single-line A/D ratio bar */
.breadth-pulse{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.breadth-pulse .ratio{font-size:12px;font-weight:700}
.breadth-pulse .bar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.breadth-pulse .bar > span{display:block;height:100%;background:var(--s2);transition:width .3s}
.breadth-pulse .bar > span.bear{background:var(--s4)}

@media(max-width:620px){
  .app{padding:0 12px 32px}
  .nav{position:sticky;top:0;gap:6px;padding:8px 0}
  .nav button{padding:10px 12px;font-size:13px}
  .stage-pill{min-width:calc(50% - 5px);font-size:14px}
  .stage-pill .cnt{font-size:24px}
  .ticker{font-size:16px;font-weight:700}
  .price b{font-size:17px}
  .gain,.loss{font-size:13px;font-weight:700}
  .basic-strip{font-size:10px}
  .cards{grid-template-columns:1fr}
  .l2-bar .chip{padding:10px 12px}
  .tf-tools .chip{padding:10px 14px;font-size:12px}
  .search{padding:13px 14px;font-size:16px}
  .nav-arrow,.modal-close{min-width:44px;min-height:44px;padding:11px 14px;font-size:16px}
  #chartPanLeft,#chartPanRight{min-width:44px;min-height:44px;padding:11px 14px;font-size:15px}
}
.modal-bg{display:none;position:fixed;inset:0;z-index:200;background:rgba(3,7,13,.78);align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.modal-shell{padding:18px 24px 24px}
.modal-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:32px minmax(0,1fr) 32px 32px;align-items:start;gap:8px;margin:0 0 14px;padding:0 0 10px;background:linear-gradient(var(--panel) 84%,transparent)}
.modal-title{margin:0;min-width:0;font-size:clamp(20px,4vw,25px);line-height:1.12;letter-spacing:-.04em}
.modal-title .title-link{color:var(--text);text-decoration:none}.modal-title .title-link:hover{color:var(--blue)}
.modal-subtitle{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.01em}
.tf-tools{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tf-tools .chip{padding:6px 10px;font-size:11px}
.tf-tools .chip.active{background:var(--blue);color:#06101f;border-color:var(--blue)}
.modal .chip{margin-top:0}
.tv-link{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:11px;font-weight:750;text-decoration:none}
.tv-link:hover{color:var(--text)}
.nav-arrow,.modal-close{width:32px;height:32px;min-width:32px;min-height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:15px;font-weight:800;line-height:1}
.nav-arrow:hover,.modal-close:hover{color:var(--text);border-color:var(--blue);background:#1d2b40}
.nav-arrow:disabled{opacity:.35;cursor:not-allowed}
.modal-close{color:var(--red)}
.decision-banner{padding:12px 14px;margin:0 0 14px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;background:var(--panel2)}
.decision-banner .decision-label{font-size:16px;font-weight:850;letter-spacing:.02em}
.decision-banner .decision-reason{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}
.modal-price{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}.modal-price b{font-size:29px;letter-spacing:-.045em}.modal-price span{font-size:14px;font-weight:750}
.modal-section-label{margin:16px 0 8px;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.detail-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}.detail-fact{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.detail-fact .k{display:block;color:var(--muted);font-size:11px}.detail-fact .v{display:block;margin-top:3px;color:var(--text);font-size:13px;font-weight:750}
.setup-note{padding:10px 12px;border-left:3px solid var(--amber);background:rgba(255,196,77,.08);border-radius:8px;color:var(--text);font-size:13px;line-height:1.45}

function computeMarketPosture(items){
  const xs=Array.isArray(items)?items:[];
  const total=xs.length||1;
  const constructive=xs.filter(i=>i.stage==="S1_basing"||i.stage==="S2_uptrend").length;
  const constructivePct=constructive/total*100;
  const ma=xs.map(i=>({i,ma200:i.ma200??i.ma200Value})).filter(x=>Number.isFinite(Number(x.i.close))&&Number.isFinite(Number(x.ma200))&&Number(x.ma200)>0);
  const above=ma.filter(x=>Number(x.i.close)>Number(x.ma200)).length;
  const ma200Pct=ma.length?above/ma.length*100:null;
  let state="Mixed",reason="MA200 breadth unavailable";
  const L=localeLabels[language]||localeLabels.en; // for state name translation
  if(ma.length){
    reason=`Stage breadth ${constructivePct.toFixed(1)}% · MA200 breadth ${ma200Pct.toFixed(1)}%`;
    if(constructivePct>=55&&ma200Pct>=50)state="Favorable";
    else if(constructivePct<40||ma200Pct<35)state="Defensive";
  }
  return {state,constructivePct,ma200Pct,eligibleMa200:ma.length,reason};
}
function triggerDistance(i){
  const trigger=Number(i?.breakoutEvidence?.trigger), close=Number(i?.close);
  if(!Number.isFinite(trigger)||trigger<=0||!Number.isFinite(close))return null;
  return {trigger,distance_pct:(close-trigger)/trigger*100};
}

function freshBadge(i){
  // Q12: four provenance states — Daily EOD / Intraday● / Stale / Unknown
  if(i.intradayFreshness?.status==="unavailable" && i.intradayFeedStatus==="unavailable") return `<span class="fresh-badge eod" title="${esc(t("freshBadgeEodUnavailable"))}${i.intradayFeedReason?": "+esc(i.intradayFeedReason):""}">${esc(t("freshBadgeEodUnavailable"))}</span>`;
  if(i.stale && i.intradayFeedReason && i.intradayFeedReason.includes(">60")) return `<span class="fresh-badge hard_stale" title="${esc(t("freshBadgeHardStale"))}">⚠ ${language==="th"?"หมดอายุนาน":"Hard Stale"}</span>`;
  if(i.stale) return `<span class="fresh-badge stale_warning" title="${esc(t("freshBadgeStale"))}">⚠ ${language==="th"?"หมดอายุ":"Stale"}</span>`;
  if(i.intradayAvailable) return `<span class="fresh-badge live" title="${esc(t("freshBadgeLive"))}">● ${language==="th"?"เรียลไทม์":"Intraday"}</span>`;
  if(i.priceLabel && i.priceLabel!=="Unknown") return `<span class="fresh-badge eod" title="${t("freshBadgeEod")}: ${esc(i.priceLabel)}">${language==="th"?"ปิดวัน":"Daily EOD"}</span>`;
  return `<span class="fresh-badge unknown" title="${esc(t("freshBadgeUnknown"))}">${language==="th"?"ไม่ทราบ":"Unknown"}</span>`;
}

function qualityLevel(i){

      ${i.radarBadge?`<span class="chip" style="background:${i.radarBadge==="READY"?"var(--green)":"var(--amber)"}22;color:${i.radarBadge==="READY"?"var(--green)":"var(--amber)"};border-color:${i.radarBadge==="READY"?"var(--green)":"var(--amber)"};font-size:10px;padding:2px 8px;margin-left:6px">${i.radarBadge}</span>`:""}

    ${triggerLine}

    ${company}
    ${i.breakoutEvidence&&i.breakoutEvidence.trigger!=null?`<div class="setup-evidence">close ${num(i.breakoutEvidence.close)} vs trigger ${num(i.breakoutEvidence.trigger)} · vol ${num(i.breakoutEvidence.volume_ratio,2)}×</div>`:""}
    ${i.volumeSurge?`<div class="setup-evidence surge">${language==="th"?"ภาวะเพิ่มปริมาณ":"VOLUME SURGE"} ${num(i.volumeSurgeRatio,1)}×</div>`:""}

function populateIndependenceFilters(){
  ["sector","industry"].forEach(key=>{
    const values=[...new Set(items.map(i=>profileValue(i,key)).filter(Boolean))].sort();
    const root=document.getElementById(`${key}Filter`); if(!root)return;
    root.innerHTML=`<option value="all">All ${key[0].toUpperCase()+key.slice(1)}</option>`+
      values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
    root.value=indep[key]||"all";
    root.onchange=()=>{indep[key]=root.value||"all";render();};
  });
}
function current(excludeProxStage=null){
  const q=document.getElementById("search").value.trim().toLowerCase();
  return items.filter(i=>{
    if(liquidity!=="all"&&i.lowValue)return false;
    if(stageFilter!=="all"&&i.stage!==stageFilter)return false;
    if(indep.set50&&!(i.independence&&i.independence.is_set50))return false;
    if(indep.value>0&&!(i.independence&&i.independence.avgTradeValue20>=(indep.value*1e6)))return false;
    if(indep.band!=="all"&&!(i.independence&&i.independence.priceBand===indep.band))return false;
    if(indep.sector!=="all"&&profileValue(i,"sector")!==indep.sector)return false;
    if(indep.industry!=="all"&&profileValue(i,"industry")!==indep.industry)return false;
    const pf=proxFilter[i.stage];
    if(excludeProxStage!==i.stage&&pf&&pf!=="all"&&proximityState(i)!==pf)return false;
    if(q&&!`${i.symbol} ${i.stage} ${i.phase} ${i.action} ${i.actionReason}`.toLowerCase().includes(q))return false;
    return true;
  });
}

}

    return `<article class="stage-pill ${cls}" aria-label="${esc(STAGE_LABEL[s])}"><h3>${esc(STAGE_LABEL[s])}</h3><div class="cnt">${c}</div><div style="color:var(--muted);font-size:11px">${pctv}% ของตลาด</div></article>`;
  }).join("");

  const adv = (stageMeta["S2_uptrend"]?.count || items.filter(i=>i.stage==="S2_uptrend").length) +
              (stageMeta["S1_basing"]?.count || items.filter(i=>i.stage==="S1_basing").length);
  const dec = (stageMeta["S4_down"]?.count || items.filter(i=>i.stage==="S4_down").length) +
              (stageMeta["S3_distributing"]?.count || items.filter(i=>i.stage==="S3_distributing").length);
  const breadthPct = total ? Math.round(adv/total*100) : 0;

  if(pulse) pulse.innerHTML=`<span class="ratio">${breadthPct}% ${language==="th"?"ขึ้น":"up"}</span><div class="bar"><span style="width:${breadthPct}%"></span></div>`;
}

function loadChart(symbol, tf, gen){
  if(gen!==undefined && gen!==detailGen)return;
  currentTf=tf;
  const status=document.getElementById("chartStatus"); if(status){status.className="chart-status";status.textContent=t("loadChart")+" "+(TF_LABEL[tf]||tf);}
  if(chartAbort)chartAbort.abort();
  const ac=chartAbort=new AbortController();
  const fetchLimit=(tf==="1M")?500:200;
  fetch(`${apiBase}/chart/${encodeURIComponent(symbol)}?timeframe=${tf}&limit=${fetchLimit}`,{signal:ac.signal})
    .then(r=>r.json()).then(d=>{ if(gen!==detailGen)return; if(d&&d.bars&&d.bars.length){ lastBars=d.bars; drawChart(d.bars, tf); if(status)status.textContent=""; } else { fallback(symbol,tf,gen); } })
    .catch(()=>{ if(gen===detailGen)fallback(symbol,tf,gen); });
}
function fallback(symbol,tf,gen){
  if(gen!==detailGen)return;
  const status=document.getElementById("chartStatus");
  const label=TF_LABEL[tf]||tf;

}
let chartViewOffset=0; // how many bars scrolled back from the right edge (pan)
function drawChart(bars, tf){
  const cv=document.getElementById("detailChart"); if(!cv||!bars||!bars.length)return;
  const ctx=cv.getContext("2d");
  const W=cv.width=cv.clientWidth||520, H=cv.height=cv.clientHeight||220;
  const drawN=(tf==="1M")?bars.length:Math.min(60,bars.length);
  const maxOffset=Math.max(0, bars.length-drawN);
  if(chartViewOffset>maxOffset)chartViewOffset=maxOffset;
  if(chartViewOffset<0)chartViewOffset=0;
  const sliceStart=Math.max(0, bars.length-drawN-chartViewOffset);
  const slice=bars.slice(sliceStart, sliceStart+drawN), n=slice.length; if(!n)return;
  const lo=Math.min(...slice.map(b=>b.low)), hi=Math.max(...slice.map(b=>b.high)), rng=(hi-lo)||1;
  const pad=10, top=10, plotH=H-2*pad, cw=W/n;
  ctx.clearRect(0,0,W,H);
  slice.forEach((b,k)=>{
    const x=k*cw+cw/2;
    const yH=top+(1-(b.high-lo)/rng)*plotH, yL=top+(1-(b.low-lo)/rng)*plotH;
    const yC=top+(1-(b.close-lo)/rng)*plotH, yO=top+(1-(b.open-lo)/rng)*plotH;
    const up=b.close>=b.open;
    const candleColor=up?"#43df9e":"#ff7a7a";
    ctx.strokeStyle=candleColor; ctx.fillStyle=candleColor;
    ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.stroke();
    const bw=Math.max(1,cw*0.6);
    ctx.fillRect(x-bw/2,Math.min(yO,yC),bw,Math.abs(yC-yO)||1);
  });
  const closes=bars.map(b=>b.close), startIdx=sliceStart;
  const maDefs=[{n:20,c:"#ffc45d",label:"MA20"},{n:50,c:"#79adff",label:"MA50"},{n:200,c:"#c08bff",label:"MA200"}];
  const legend=[];
  maDefs.forEach(m=>{
    ctx.strokeStyle=m.c; ctx.lineWidth=1.5; ctx.beginPath(); let started=false, drew=false;
    for(let k=0;k<n;k++){ const abs=startIdx+k; if(abs>=m.n-1){ let s=0; for(let j=abs-m.n+1;j<=abs;j++)s+=closes[j]; const val=s/m.n; const x=k*cw+cw/2; const y=top+(1-(val-lo)/rng)*plotH; if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y); drew=true; } }
    ctx.stroke(); if(drew)legend.push(`<span style="color:${m.c}">● ${m.label}</span>`);
  });
  const lg=document.getElementById("chartLegend"); if(lg)lg.innerHTML=legend.join(" ");
  const hint=document.getElementById("chartPanHint"); if(hint)hint.textContent=(chartViewOffset>0?`← เลื่อนกลับ ${chartViewOffset} แท่ง`:"ลาก/สกปร์เลื่อนแกนเวลา");
}
let lastBars=null;
function panChart(dir){
  chartViewOffset = Math.max(0, (chartViewOffset||0) + (dir<0?6:-6));
  if(lastBars)drawChart(lastBars, currentTf);
}
// --- Chart pan: buttons + wheel + drag on canvas; touch-action none prevents scroll hijack ---
let _panBound=false;
function bindChartPan(){
  const cv=document.getElementById("detailChart"); if(!cv||_panBound)return; _panBound=true;
  cv.style.touchAction="none";
  const L=document.getElementById("chartPanLeft"), R=document.getElementById("chartPanRight");
  if(L)L.onclick=()=>panChart(-1);
  if(R)R.onclick=()=>panChart(1);
  cv.addEventListener("wheel",e=>{
    const d=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY);
    if(!d)return;
    e.preventDefault();
    chartViewOffset += (d>0?1:-1)*2;
    if(lastBars)drawChart(lastBars, currentTf);
  },{passive:false});
  let dragging=false, lastX=0;
  cv.addEventListener("mousedown",e=>{ dragging=true; lastX=e.clientX; cv.style.cursor="grabbing"; });
  window.addEventListener("mouseup",()=>{ dragging=false; cv.style.cursor="grab"; });
  cv.addEventListener("mousemove",e=>{
    if(!dragging)return;
    const dx=e.clientX-lastX; lastX=e.clientX;
    if(Math.abs(dx)<3)return;
    chartViewOffset += (dx>0?1:-1)*2;
    if(lastBars)drawChart(lastBars, currentTf);
  });
}

function stepStock(dir){

function setLoadProgress(percent,step){
  const bar=document.getElementById("loadProgress"), pct=document.getElementById("loadPercent"), label=document.getElementById("loadStep");
  if(bar)bar.style.width=`${percent}%`; if(pct)pct.textContent=`${percent}%`; if(label)label.textContent=step;
}
function loadRemoteDashboard(){
  // Single coherent first paint: the built HTML already embeds the complete
  // snapshot. Do not paint compact S2 cards first and then replace them with
  // four stage fetches — that created the visible blank → loading → uptrend →
  // complete sequence and temporarily hid S1/S3/S4 from the trader.
  const state=document.getElementById("liveState");
  let loadDone=false;
  const finishLoading=()=>{if(loadDone)return;loadDone=true;setLoadProgress(100,t("ready"));document.body.classList.remove("loading");};
  const failLoading=(err)=>{console.error("Signalix snapshot render failed",err);if(state)state.textContent=t("loadFailed");setLoadProgress(100,t("loadFailed"));document.body.classList.remove("loading");};
  window.setTimeout(()=>{if(!loadDone){try{render();finishLoading();}catch(err){failLoading(err);}}},5000);
  try{
    setLoadProgress(18,t("readingSnapshot"));
    requestAnimationFrame(()=>{
      bySymbol=Object.fromEntries(items.map(i=>[i.symbol,i]));
      document.getElementById("covCount").textContent=items.length;
      setLoadProgress(42,t("indexingStages"));
      requestAnimationFrame(()=>{
        const fmtTime=v=>v?new Date(v).toLocaleString("en-GB",{timeZone:"Asia/Bangkok",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" ICT":"—";
        document.getElementById("provFetchedLabel").textContent=t("lastScanned")+": "+fmtTime(dashboardMeta.intraday_scan_time||dashboardMeta.data_fetched_at);
        setLoadProgress(70,t("buildingStages"));
        requestAnimationFrame(()=>{
          try{
            render();
            renderMarketRegime();
            if(state)state.textContent=t("ready")+" · "+items.length+" "+t("cards")+" · "+t("snapshot");
            requestAnimationFrame(finishLoading);
          }catch(err){failLoading(err);}
        });
      });
    });
  }catch(err){
    failLoading(err);
    document.getElementById("results").innerHTML=`<div class="empty">${t("loadFailed")} — ${esc(err.message)}<br><button class="chip" onclick="loadRemoteDashboard()">${t("retry")}</button></div>`;
  }
}
loadRemoteDashboard();
