<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signalix — AI Buildout</title><style>:root{--bg:#090e17;--p:#111a28;--line:#27364b;--t:#edf3fb;--m:#92a2b7;--b:#79adff;--g:#43df9e;--a:#ffc45d;--r:#ff7a7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:0 22px 48px}.top{padding:24px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-size:24px;font-weight:900}.brand b{color:var(--b)}a{color:var(--b)}h1{margin:26px 0 5px;font-size:30px}p{color:var(--m);margin:5px 0 18px}.notice{border:1px solid #745d2a;background:#221c10;color:#ffe5a7;padding:12px;border-radius:9px;margin:16px 0}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{background:var(--p);border:1px solid var(--line);padding:9px 12px;border-radius:8px;color:var(--m)}.pill b{color:var(--t)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:15px;cursor:pointer}.card:hover{border-color:var(--b)}.topline{display:flex;justify-content:space-between}.ticker{font-weight:900;font-size:20px}.badge{padding:4px 7px;border-radius:6px;background:#182940;color:var(--b);font-size:12px}.price{font-size:26px;font-weight:800;margin:14px 0 5px}.muted{color:var(--m);font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.stats div{background:#0c1420;padding:8px;border-radius:7px;color:var(--m)}.stats b{display:block;color:var(--t);margin-top:3px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px}.modal.open{display:grid}.panel{width:min(900px,100%);max-height:94vh;overflow:auto;background:#101a29;border:1px solid var(--line);border-radius:12px;padding:18px}.close{float:right;background:none;border:0;color:var(--t);font-size:27px;cursor:pointer}canvas{width:100%;height:330px;background:#0a111c;border-radius:9px;margin-top:15px}.error{color:var(--r)}@media(max-width:600px){.app{padding:0 14px}.top{align-items:flex-start;flex-direction:column}h1{font-size:25px}}</style></head><body><main class="app"><header class="top"><div class="brand">Signal<b>ix</b> · AI Buildout</div><a href="dashboard.html">← Thai Screener</a></header><h1>AI Buildout — US</h1><p>13F-derived research universe · Signalix technical scan · click a card to lazy-load its Daily chart.</p><div class="notice">Source is <b id="source">loading…</b>. This is a research watchlist, not a replicated fund portfolio or a live-price feed.</div><div id="summary" class="summary"></div><div id="cards" class="grid"></div></main><div id="modal" class="modal"><section class="panel"><button class="close" onclick="closeDetail()">×</button><h2 id="title"></h2><p id="detail"></p><canvas id="chart" width="860" height="330"></canvas><p id="chartStatus" class="muted"></p></section></div><script>const api='http://'+location.hostname+':8000';let cards=[];const n=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:2});function render(){let strong=cards.filter(x=>x.tt===8).length;document.querySelector('#summary').innerHTML=`<div class="pill"><b>${cards.length}</b> symbols scanned</div><div class="pill"><b>${strong}</b> Trend Template 8/8</div><div class="pill">Benchmark <b>SPY</b></div><div class="pill">Details/charts load only when opened</div>`;document.querySelector('#cards').innerHTML=cards.map(x=>`<article class="card" onclick="openDetail('${x.symbol}')"><div class="topline"><span class="ticker">${x.symbol}</span><span class="badge">TT ${x.tt}/8</span></div><div class="price">$${n(x.close)}</div><div class="muted">Daily EOD · ${x.last_date} · ${x.status||'WAIT'}</div><div class="stats"><div>RS<b>${n(x.rs)}</b></div><div>RSI<b>${n(x.rsi)}</b></div><div>Trigger<b>${n(x.trigger)}</b></div><div>Stop<b>${n(x.stop)}</b></div></div></article>`).join('')}async function openDetail(sym){let x=cards.find(v=>v.symbol===sym),m=document.querySelector('#modal');m.classList.add('open');document.querySelector('#title').textContent=`${sym} · Daily technical detail`;document.querySelector('#detail').textContent=`TT ${x.tt}/8 · RS ${n(x.rs)} · RSI ${n(x.rsi)} · trigger ${n(x.trigger)} · stop ${n(x.stop)}${x.vcp?' · VCP detected':''}`;let st=document.querySelector('#chartStatus');st.textContent='Loading stored US Daily chart…';try{let r=await fetch(`${api}/chart/${sym}?market=US&timeframe=1D&limit=180`);if(!r.ok)throw Error();let d=await r.json();draw(d.bars,x);st.textContent=`${d.label} · ${d.bars.length} bars · latest ${d.latest_time}`}catch(e){st.textContent='Chart unavailable';st.className='error'}}function closeDetail(){document.querySelector('#modal').classList.remove('open')}function draw(bars,x){let c=document.querySelector('#chart'),ctx=c.getContext('2d'),w=c.width,h=c.height,last=bars.slice(-120),lo=Math.min(...last.map(b=>b.low),x.stop||Infinity),hi=Math.max(...last.map(b=>b.high),x.trigger||-Infinity),pad=(hi-lo)*.1||1;lo-=pad;hi+=pad;ctx.clearRect(0,0,w,h);let X=i=>45+i*(w-60)/(last.length-1),Y=v=>20+(hi-v)/(hi-lo)*(h-55);ctx.strokeStyle='#26384f';for(let i=0;i<5;i++){let y=20+i*(h-55)/4;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(w-15,y);ctx.stroke()}for(let i=0;i<last.length;i++){let b=last[i],up=b.close>=b.open,col=up?'#43df9e':'#ff7a7a',xx=X(i);ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(xx,Y(b.high));ctx.lineTo(xx,Y(b.low));ctx.stroke();ctx.fillStyle=col;ctx.fillRect(xx-2,Y(Math.max(b.open,b.close)),4,Math.max(1,Math.abs(Y(b.open)-Y(b.close))))}for(let [v,col,label] of [[x.trigger,'#79adff','trigger'],[x.stop,'#ff7a7a','stop']])if(v){ctx.strokeStyle=col;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(45,Y(v));ctx.lineTo(w-15,Y(v));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.fillText(label,w-55,Y(v)-4)}}fetch(api+'/watchlists/us-ai-buildout').then(r=>r.json()).then(d=>{cards=d.cards;document.querySelector('#source').textContent=d.source+' · Daily EOD';render()}).catch(()=>document.querySelector('#cards').innerHTML='<p class="error">Watchlist API unavailable</p>');</script></body></html>
