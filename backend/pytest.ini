[pytest]
# Run from backend/ with /root/.venv_img/bin/python -m pytest (or pytest).
# Default collectors exclude slow DB-backed integration tests; run them
# explicitly with: -m integration  (requires POSTGRES_HOST=127.0.0.1).
testpaths = .
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
markers =
    integration: tests that require a live PostgreSQL connection
    slow: tests with significant runtime (>10s)
addopts = -q -m "not integration"
